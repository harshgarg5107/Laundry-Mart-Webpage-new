<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>book now</title>
</head>
<body>
    <section id="booking">
                <h3>Book Now </h3>
                <form action="">
                    <label for="uname">Enter Name</label><input type="text" name=""  required id="uname">
                    <br><br>
                    <label for="uemail">Enter Email</label><input type="email" name=""  required id="uemail">
                    <br><br>
                    <label for="unum">Enter Contact Number</label><input type="tel"  name="" required id="unum">
                    <br><br>
                    <label for="udate">Enter booking date</label><input type="date" name="" required id="udate">
                    <br><br>
                    <label for="Washing">Washing</label><input type="radio" name="service" value="Washing" id="Washing">
                    <label for="Dry-Cleaning">Dry Cleaning</label><input type="radio" name="service" value="Dry Cleaning" id="Dry-Cleaning">
                    <label for="Ironing-Folding">Ironing & Folding</label><input type="radio" name="service" value="Ironing & Folding" id="Ironing-Folding">
                    <label for="Stain-Removal">Washing✨ Stain Removal</label><input type="radio" name="service" value="Washing✨ Stain Removal" id="Stain-Removal">
                    <label for="b&c">blanket & Curtain</label><input type="radio" name="service" value="blanket & Curtain" id="b&c">
                    
                    <input type="submit">
                </form>
            </section>
            
             
</body>
</html>
